name: ecommerce
description: "An e-commerce flutter app"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.0

dependencies:
  cached_network_image: ^4.0.4
  carousel_slider_plus: ^7.0.1
  cupertino_icons:
  flutter:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  auto_size_text: ^3.0.0
  colornames: ^0.2.0
  flutter_svg: ^2.0.10+1
  flutter_native_splash: ^2.4.1
  readmore: ^3.0.0
  smooth_page_indicator: ^3.0.0
  dio: ^5.7.0
  shared_preferences: ^2.3.2
  flutter_bloc: ^9.1.1
  fluttertoast: ^10.0.2
  dartz: ^0.10.1
  get_it: ^9.3.0
  injectable: ^3.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  build_runner: ^2.4.11
  injectable_generator: ^3.1.3

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/svg/

  fonts:
     - family: Poppins
       fonts:
         - asset: assets/fonts/Poppins-.ttf
         